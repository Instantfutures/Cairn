[project]
name = "cairn"
version = "0.2.1"
description = "Fact-graph based collaborative exploration protocol"
authors = [
    { name = "leixiao", email = "1729888211@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "click>=8.1",
    "pyyaml>=6.0",
    "docker>=7.1.0",
    "requests>=2.32.3",
]

[project.scripts]
cairn = "cairn.cli:main"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# No default index is pinned here on purpose: a hardcoded `default = true` index
# makes `uv sync` fail outright for anyone who cannot reach that host (CI, and
# contributors outside its region), because a connection error is not treated as
# "package not found" and does not fall back to PyPI.
#
# To resolve through a local mirror instead, set it in your own environment:
#   export UV_DEFAULT_INDEX=https://mirrors.aliyun.com/pypi/simple
# That re-resolves `uv.lock` against the mirror; keep that churn out of commits.
